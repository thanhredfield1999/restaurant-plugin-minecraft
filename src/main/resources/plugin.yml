name: RestaurantTycoon
version: ${version}
main: vn.restauranttycoon.RestaurantTycoonPlugin
api-version: "1.21.11"
authors: [restauranttycoon]
description: Server-authoritative restaurant tycoon gameplay.
softdepend: [DecentHolograms, Vault]
commands:
  restaurant:
    description: Restaurant Tycoon command.
    usage: /restaurant [health|balance|market [plotId]|order <plotId>|grant|setup|setup-route|dev assign|dev mark-supplier <entityUuid>|dev mark-package <entityUuid> <packageUuid>|dev mark-warehouse <world> <x> <y> <z>|dev purchase|dev fixture]
    permission: restauranttycoon.command
permissions:
  restauranttycoon.command:
    default: true
  restauranttycoon.admin.health:
    default: op
  restauranttycoon.admin.grant:
    default: op
  restauranttycoon.admin.dev:
    default: op
  restauranttycoon.admin.setup:
    default: op
